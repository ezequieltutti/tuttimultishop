<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutti Multishop</title>

  <!-- Montserrat para el nombre de la marca -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: rgb(8,8,8); color:#030303; }
    button,input { font: inherit; }
    a { color:inherit; text-decoration:none; }

    header {
      background: rgba(255,0,0,.788);
      border-bottom: 1px solid rgba(255,0,0,.788);
      position: sticky; top:0; z-index:20;
    }
    .topbar {
      max-width:1200px; margin:auto; padding:18px 20px;
      display:flex; align-items:center; gap:25px;
    }
    .logo {
      font-family:'Montserrat',sans-serif;
      font-size:24px; font-weight:700; letter-spacing:1px;
      white-space:nowrap; color:#fff; text-transform:uppercase;
    }
    .search { flex:1; position:relative; }
    .search input {
      width:100%; padding:13px 16px; border:1px solid #ddd;
      border-radius:8px; outline:none; background:#fafafa;
    }
    .search input:focus { border-color:#888; background:#fff; }
    .cart-button {
      border:0; background:#000; color:#fff; padding:12px 17px;
      border-radius:8px; cursor:pointer; font-weight:700; position:relative;
    }
    .cart-count {
      background:#0b9906d3; min-width:20px; height:20px; padding:0 5px;
      border-radius:20px; position:absolute; top:-8px; right:-8px;
      font-size:12px; display:grid; place-items:center;
    }

    .hero {
      max-width:1200px; margin:25px auto 0; padding:55px 30px;
      border-radius:14px;
      background:linear-gradient(120deg,#0c0c0c,#e40909);
      color:white; position:relative; overflow:hidden;
      min-height:250px;
      display:flex; align-items:center;
    }
    .hero-content { position:relative; z-index:2; max-width:62%; }
    .hero h1 { font-size:clamp(30px,5vw,52px); margin-bottom:12px; }
    .hero p { max-width:600px; color:#ddd; line-height:1.6; }
    .hero-brand {
      position:absolute; right:7%; top:50%; transform:translateY(-50%);
      width:260px; display:flex; justify-content:center; align-items:center;
      z-index:2;
    }
    .hero-brand img {
      width:100%; height:auto; display:block;
      filter:drop-shadow(0 8px 15px rgba(0,0,0,.22));
    }

    .categories { max-width:1200px; margin:25px auto 0; padding:0 20px; }
    .categories-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; gap:15px; }
    .categories-header h2 { color:white; font-size:24px; }
    .category-all { border:0; background:#e40909; color:white; padding:9px 16px; border-radius:7px; cursor:pointer; font-weight:700; transition:.2s; }
    .category-all:hover { background:#b90000; }
    .category-list { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; }
    .category-button { border:0; background:white; color:#111; min-height:75px; padding:12px 8px; border-radius:10px; cursor:pointer; font-weight:700; transition:.2s; border:2px solid transparent; }
    .category-button:hover { background:#e40909; color:white; transform:translateY(-2px); }
    .category-button.active { background:#e40909; color:white; border-color:#ff4444; }
    .category-icon { display:block; font-size:26px; margin-bottom:6px; }

    main { max-width:1200px; margin:auto; padding:30px 20px 70px; }
    .section-title { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:20px; }
    .section-title h2 { font-size:26px; color:white; }
    #resultCount { color:#aaa; }
    .products { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
    .product { background:white; border-radius:12px; overflow:hidden; border:1px solid #e8e8e8; transition:transform .2s,box-shadow .2s; }
    .product:hover { transform:translateY(-3px); box-shadow:0 8px 25px rgba(0,0,0,.08); }
    .product-gallery { width:100%; position:relative; overflow:hidden; background:#eee; }
    .product-image { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#eee; }
    .gallery-arrow { position:absolute; top:50%; transform:translateY(-50%); z-index:5; width:38px; height:38px; border:0; border-radius:50%; background:rgba(0,0,0,.55); color:white; display:flex; align-items:center; justify-content:center; font-size:30px; line-height:1; cursor:pointer; padding:0; transition:background .2s,transform .2s; }
    .gallery-arrow:hover { background:rgba(0,0,0,.8); transform:translateY(-50%) scale(1.05); }
    .gallery-arrow.prev { left:10px; }
    .gallery-arrow.next { right:10px; }
    .gallery-dots { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; gap:6px; z-index:5; }
    .gallery-dot { width:8px; height:8px; border:0; border-radius:50%; background:rgba(255,255,255,.65); padding:0; cursor:pointer; }
    .gallery-dot.active { background:white; transform:scale(1.25); }
    .product-info { padding:16px; }
    .product-category { color:#555; font-size:12px; text-transform:uppercase; margin-bottom:7px; }
    .product-name { font-size:17px; font-weight:700; margin-bottom:10px; min-height:42px; }
    .price { font-size:22px; font-weight:800; margin-bottom:13px; }
    .add-button { width:100%; border:0; border-radius:8px; padding:12px; background:green; color:#fff; cursor:pointer; font-weight:700; }
    .add-button:hover { background:#444; }
    .empty { grid-column:1/-1; text-align:center; padding:50px; color:#777; background:#fff; border-radius:12px; }

    .free-shipping { max-width:1200px; margin:0 auto 35px; padding:22px 25px; background:linear-gradient(120deg,#111,#e40909); color:white; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:18px; text-align:center; box-shadow:0 5px 20px rgba(0,0,0,.25); }
    .free-shipping-icon { font-size:42px; }
    .free-shipping h3 { font-size:22px; margin-bottom:6px; }
    .free-shipping p { font-size:15px; color:#eee; }
    .free-shipping strong { color:white; font-size:17px; }

    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; opacity:0; visibility:hidden; transition:.25s; }
    .overlay.active { opacity:1; visibility:visible; }
    .cart { position:fixed; z-index:60; top:0; right:0; width:min(430px,100%); height:100vh; background:white; transform:translateX(100%); transition:.3s; display:flex; flex-direction:column; }
    .cart.active { transform:translateX(0); }
    .cart-header { padding:20px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
    .close-cart { border:0; background:#f2f2f2; width:35px; height:35px; border-radius:50%; cursor:pointer; font-size:20px; }
    .cart-items { flex:1; overflow-y:auto; padding:15px 20px; }
    .cart-item { display:grid; grid-template-columns:70px 1fr auto; gap:12px; padding:15px 0; border-bottom:1px solid #eee; align-items:center; }
    .cart-item img { width:70px; height:70px; object-fit:cover; border-radius:8px; }
    .cart-item-name { font-weight:700; margin-bottom:7px; }
    .cart-item-price { font-size:14px; color:#666; }
    .quantity { display:flex; align-items:center; gap:8px; margin-top:10px; }
    .quantity button { border:1px solid #ddd; background:#fff; width:27px; height:27px; border-radius:5px; cursor:pointer; }
    .remove { color:#c00; border:0; background:transparent; cursor:pointer; font-size:12px; margin-top:7px; }
    .cart-footer { padding:20px; border-top:1px solid #eee; }
    .subtotal { display:flex; justify-content:space-between; font-size:20px; font-weight:800; margin-bottom:15px; }
    .checkout { width:100%; border:0; background:#25d366; color:white; padding:15px; border-radius:8px; cursor:pointer; font-weight:800; font-size:16px; }
    .clear-cart { width:100%; border:0; background:transparent; padding:10px; cursor:pointer; color:#777; }

    footer { background:rgba(255,0,0,.788); color:#fff; text-align:center; padding:30px 20px; }

    @media (max-width:900px) {
      .products { grid-template-columns:repeat(3,1fr); }
      .category-list { grid-template-columns:repeat(3,1fr); }
      .hero-brand { right:4%; width:220px; }
    }
    @media (max-width:650px) {
      .topbar { flex-wrap:wrap; gap:12px; }
      .logo { width:100%; font-size:22px; }
      .search { order:3; flex-basis:100%; }
      .cart-button { position:absolute; right:20px; top:16px; }
      .hero { margin:15px 12px 0; padding:35px 22px; min-height:330px; align-items:flex-start; }
      .hero-content { max-width:100%; }
      .hero-brand { top:auto; bottom:18px; right:50%; transform:translateX(50%); width:190px; }
      .categories { margin-top:18px; padding-left:12px; padding-right:12px; }
      .category-list { grid-template-columns:repeat(2,1fr); gap:10px; }
      .category-button { min-height:70px; }
      main { padding-left:12px; padding-right:12px; }
      .products { grid-template-columns:repeat(2,1fr); gap:12px; }
      .product-info { padding:12px; }
      .product-name { font-size:15px; }
      .price { font-size:19px; }
      .gallery-arrow { width:34px; height:34px; font-size:26px; }
      .gallery-arrow.prev { left:7px; }
      .gallery-arrow.next { right:7px; }
      .free-shipping { margin:0 12px 25px; padding:20px 15px; gap:12px; }
      .free-shipping-icon { font-size:32px; }
      .free-shipping h3 { font-size:18px; }
      .free-shipping p { font-size:13px; }
    }
    @media (max-width:390px) {
      .products { grid-template-columns:1fr; }
      .category-list { grid-template-columns:repeat(2,1fr); }
    }
  </style>
</head>

<header>
  <div class="topbar">
    <div class="logo">TUTTI MULTISHOP</div>
    <div class="search">
      <input id="searchInput" type="search" placeholder="Buscar productos...">
    </div>
    <button class="cart-button" id="openCart">
      🛒 Carrito
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Todo lo que buscás</h1>
    <p>Encontrá nuestros productos y comprá de manera rápida y sencilla.</p>
  </div>

  <div class="hero-brand">
    <img src="tutti-logo-hero.png" alt="Tutti Multishop">
  </div>
</section>

<section class="categories">
  <div class="categories-header">
    <h2>Categorías</h2>
    <button class="category-all" id="showAllCategories">Ver todos</button>
  </div>

  <div class="category-list">
    <button class="category-button" data-category="Muebles"><span class="category-icon">🪑</span>Muebles</button>
    <button class="category-button" data-category="Hogar"><span class="category-icon">🏠</span>Hogar/Jardín</button>
    <button class="category-button" data-category="Fitness"><span class="category-icon">🏃</span>Fitness</button>
    <button class="category-button" data-category="Accesorios"><span class="category-icon">🎧</span>Accesorios</button>
    <button class="category-button" data-category="Electrónica"><span class="category-icon">💻</span>Electrónica</button>
    <button class="category-button" data-category="Otros"><span class="category-icon">📦</span>Otros</button>
  </div>
</section>

<main>
  <div class="section-title">
    <h2>Productos</h2>
    <span id="resultCount"></span>
  </div>
  <div class="products" id="productsContainer"></div>
</main>

<section class="free-shipping">
  <div class="free-shipping-icon">🚚</div>
  <div>
    <h3>¡Envío gratis a todo el país!</h3>
    <p>En compras desde <strong>$20.000</strong>, el envío es totalmente gratis.</p>
  </div>
</section>

<footer>
  <p>© 2026 Tutti Multishop — Todos los derechos reservados.</p>
</footer>

<div class="overlay" id="overlay"></div>

<aside class="cart" id="cart">
  <div class="cart-header">
    <h2>Tu carrito</h2>
    <button class="close-cart" id="closeCart">×</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="subtotal"><span>Total</span><span id="cartTotal">$0</span></div>
    <button class="checkout" id="checkoutButton">Finalizar compra</button>
    <button class="clear-cart" id="clearCart">Vaciar carrito</button>
  </div>
</aside>

      category: "Electronica",
      images: ["https://http2.mlstatic.com/D_NQ_NP_2X_834724-MLA70058640898_062023-F.webp",
               "https://http2.mlstatic.com/D_NQ_NP_2X_700568-MLA70078500105_062023-F.webp",
               "https://http2.mlstatic.com/D_NQ_NP_2X_947964-MLA70058582662_062023-F.webp",
               "https://http2.mlstatic.com/D_NQ_NP_2X_721868-MLA70058660024_062023-F.webp",
               "https://http2.mlstatic.com/D_NQ_NP_2X_843728-MLA70058602212_062023-F.webp"
      ]
    }
  ];

  let cart = JSON.parse(localStorage.getItem("miTiendaCart")) || [];
  const galleryPositions = {};
  const productsContainer = document.getElementById("productsContainer");
  const cartItems = document.getElementById("cartItems");
  const cartTotal = document.getElementById("cartTotal");
  const cartCount = document.getElementById("cartCount");
  const cartElement = document.getElementById("cart");
  const overlay = document.getElementById("overlay");
  const searchInput = document.getElementById("searchInput");
  const resultCount = document.getElementById("resultCount");

  function formatPrice(price) {
    return new Intl.NumberFormat("es-AR", { style:"currency", currency:"ARS", maximumFractionDigits:0 }).format(price);
  }

  function saveCart() {
    localStorage.setItem("miTiendaCart", JSON.stringify(cart));
  }

  function changeGallery(productId, direction) {
    const product = products.find(p => p.id === productId);
    if (!product || product.images.length <= 1) return;
    if (galleryPositions[productId] === undefined) galleryPositions[productId] = 0;
    galleryPositions[productId] += direction;
    if (galleryPositions[productId] < 0) galleryPositions[productId] = product.images.length - 1;
    if (galleryPositions[productId] >= product.images.length) galleryPositions[productId] = 0;
    updateGallery(productId);
  }

  function setGalleryImage(productId, index) {
    const product = products.find(p => p.id === productId);
    if (!product || index < 0 || index >= product.images.length) return;
    galleryPositions[productId] = index;
    updateGallery(productId);
  }

  function updateGallery(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    const position = galleryPositions[productId] || 0;
    const imageElement = document.getElementById(`product-image-${productId}`);
    if (imageElement) imageElement.src = product.images[position];
    document.querySelectorAll(`[data-gallery-id="${productId}"] .gallery-dot`).forEach((dot,index) => dot.classList.toggle("active", index === position));
  }

  function renderProducts(list = products) {
    resultCount.textContent = `${list.length} producto${list.length !== 1 ? "s" : ""}`;
    if (!list.length) {
      productsContainer.innerHTML = `<div class="empty"><h3>No encontramos productos</h3><p>Probá con otra búsqueda o categoría.</p></div>`;
      return;
    }

    productsContainer.innerHTML = list.map(product => {
      const images = product.images || [];
      galleryPositions[product.id] = galleryPositions[product.id] ?? 0;
      const hasMultipleImages = images.length > 1;
      const currentImage = images[galleryPositions[product.id]] || "https://placehold.co/800x800?text=Sin+imagen";

      return `
        <article class="product">
          <div class="product-gallery" data-gallery-id="${product.id}">
            <img id="product-image-${product.id}" class="product-image" src="${currentImage}" alt="${product.name}" loading="lazy" onerror="this.src='https://placehold.co/800x800?text=Sin+imagen'">
            ${hasMultipleImages ? `
              <button class="gallery-arrow prev" onclick="changeGallery(${product.id},-1)" aria-label="Foto anterior">‹</button>
              <button class="gallery-arrow next" onclick="changeGallery(${product.id},1)" aria-label="Foto siguiente">›</button>
              <div class="gallery-dots">
                ${images.map((_,index) => `<button class="gallery-dot ${index === galleryPositions[product.id] ? "active" : ""}" onclick="setGalleryImage(${product.id},${index})" aria-label="Ver foto ${index+1}"></button>`).join("")}
              </div>` : ""}
          </div>
          <div class="product-info">
            <div class="product-category">${product.category}</div>
            <div class="product-name">${product.name}</div>
            <div class="price">${formatPrice(product.price)}</div>
            <button class="add-button" onclick="addToCart(${product.id})">Agregar al carrito</button>
          </div>
        </article>`;
    }).join("");
  }

  function addToCart(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    const existing = cart.find(item => item.id === productId);
    if (existing) existing.quantity++;
    else cart.push({ id: product.id, quantity:1 });
    saveCart(); renderCart(); openCart();
  }

  function changeQuantity(productId, amount) {
    const item = cart.find(item => item.id === productId);
    if (!item) return;
    item.quantity += amount;
    if (item.quantity <= 0) cart = cart.filter(item => item.id !== productId);
    saveCart(); renderCart();
  }

  function removeFromCart(productId) {
    cart = cart.filter(item => item.id !== productId);
    saveCart(); renderCart();
  }

  function renderCart() {
    if (!cart.length) {
      cartItems.innerHTML = `<div style="text-align:center;padding:50px 10px;color:#777;"><div style="font-size:45px;margin-bottom:15px;">🛒</div><h3>Tu carrito está vacío</h3><p style="margin-top:8px;">Agregá productos para comenzar.</p></div>`;
    } else {
      cartItems.innerHTML = cart.map(item => {
        const product = products.find(p => p.id === item.id);
        if (!product) return "";
        const cartImage = product.images?.[0] || "https://placehold.co/100x100?text=Imagen";
        return `
          <div class="cart-item">
            <img src="${cartImage}" alt="${product.name}" onerror="this.src='https://placehold.co/100x100?text=Imagen'">
            <div>
              <div class="cart-item-name">${product.name}</div>
              <div class="cart-item-price">${formatPrice(product.price)} c/u</div>
              <div class="quantity">
                <button onclick="changeQuantity(${product.id},-1)">−</button>
                <strong>${item.quantity}</strong>
                <button onclick="changeQuantity(${product.id},1)">+</button>
              </div>
              <button class="remove" onclick="removeFromCart(${product.id})">Eliminar</button>
            </div>
            <strong>${formatPrice(product.price * item.quantity)}</strong>
          </div>`;
      }).join("");
    }

    const total = cart.reduce((sum,item) => {
      const product = products.find(p => p.id === item.id);
      return sum + (product ? product.price * item.quantity : 0);
    },0);
    const quantity = cart.reduce((sum,item) => sum + item.quantity,0);
    cartTotal.textContent = formatPrice(total);
    cartCount.textContent = quantity;
  }

  function openCart() {
    cartElement.classList.add("active");
    overlay.classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeCart() {
    cartElement.classList.remove("active");
    overlay.classList.remove("active");
    document.body.style.overflow = "";
  }

  function checkoutWhatsApp() {
    if (!cart.length) { alert("El carrito está vacío."); return; }
    
    let textoPedido = "";
    let total = 0;
    cart.forEach(item => {
      const product = products.find(p => p.id === item.id);
      if (!product) return;
      const subtotal = product.price * item.quantity;
      total += subtotal;
      textoPedido += `• ${product.name} x${item.quantity} - ${formatPrice(subtotal)}\n`;
    });

    // Guardar información del pedido para que la tome el formulario
    localStorage.setItem("pedidoTutti", textoPedido);
    localStorage.setItem("totalTutti", formatPrice(total));

    // Redirigir al formulario
    window.location.href = "formulario.html";
  }

  let selectedCategory = "";

  function applyFilters() {
    const search = searchInput.value.toLowerCase().trim();
    let filtered = products;
    if (selectedCategory) filtered = filtered.filter(p => p.category === selectedCategory);
    if (search) filtered = filtered.filter(p =>
      p.name.toLowerCase().includes(search) ||
      p.category.toLowerCase().includes(search) ||
      (p.description && p.description.toLowerCase().includes(search))
    );
    renderProducts(filtered);
  }

  document.querySelectorAll(".category-button").forEach(button => {
    button.addEventListener("click", () => {
      selectedCategory = button.dataset.category;
      document.querySelectorAll(".category-button").forEach(b => b.classList.toggle("active", b.dataset.category === selectedCategory));
      applyFilters();
    });
  });

  document.getElementById("showAllCategories").addEventListener("click", () => {
    selectedCategory = "";
    searchInput.value = "";
    document.querySelectorAll(".category-button").forEach(b => b.classList.remove("active"));
    renderProducts(products);
  });

  searchInput.addEventListener("input", applyFilters);
  document.getElementById("openCart").addEventListener("click", openCart);
  document.getElementById("closeCart").addEventListener("click", closeCart);
  overlay.addEventListener("click", closeCart);

  document.getElementById("clearCart").addEventListener("click", () => {
    if (!cart.length) return;
    if (confirm("¿Querés vaciar el carrito?")) {
      cart = [];
      saveCart();
      renderCart();
    }
  });

  document.getElementById("checkoutButton").addEventListener("click", checkoutWhatsApp);

  renderProducts();
  renderCart();
</script>
